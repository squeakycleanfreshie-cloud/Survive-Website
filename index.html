<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Survive</title>
    <style>
        * {margin: 0; padding: 0; box-sizing: border-box;}

        body {
            background: #222;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        .poster {
            width: 100vw;
            height: 100vh;
            position: relative;
            overflow: hidden;
        }

        .poster img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
    </style>
</head>
<body>
    <div class ="poster">
        <img src="https://placehold.co/1920x1080" alt="campfire background">
    </div>
    
</body>
</html>
